name: Import ReplyMate source and build APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-replymate.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and unpack original source
        shell: bash
        run: |
          set -euo pipefail
          cat source/part*.b64 | base64 --decode > /tmp/replymate-source.tar.xz
          echo "d1b335aa49e95f641f5dc68b92bf5fa91ec7b7526dc495b6062af8011990c20a  /tmp/replymate-source.tar.xz" | sha256sum --check
          tar --exclude='.github/workflows/android-apk.yml' -xJf /tmp/replymate-source.tar.xz -C .
          rm -rf source
          test -f app/src/main/java/com/replymate/ai/MainActivity.kt
          test -f .github/workflows/android-apk.yml

      - name: Publish readable source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import complete ReplyMate AI Android source"
            git push origin HEAD:main || echo "::warning::Source auto-publish blocked. Check branch protections and workflow write permissions."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'

      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test and assemble APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ReplyMate-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
